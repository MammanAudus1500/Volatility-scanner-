name: Sixsgames Live Scanner

on:
  workflow_dispatch:

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install required libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install websocket-client requests

      - name: Check Telegram configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "❌ TELEGRAM_BOT_TOKEN is missing"
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "❌ TELEGRAM_CHAT_ID is missing"
            exit 1
          fi

          echo "✅ Telegram secrets detected."

      - name: Test Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          message = (
              "🟢 SIXSGAMES TELEGRAM TEST\n\n"
              "Telegram connection is working successfully! ✅\n\n"
              "Your scanner is ready to send alerts."
          )

          response = requests.post(
              url,
              data={
                  "chat_id": chat_id,
                  "text": message
              },
              timeout=20
          )

          print("Telegram HTTP status:", response.status_code)
          print("Telegram response:", response.text)

          if response.status_code != 200:
              raise SystemExit("❌ Telegram message failed.")

          result = response.json()

          if not result.get("ok"):
              raise SystemExit("❌ Telegram API returned an error.")

          print("✅ Telegram test message sent successfully!")
          PY

      - name: Run Sixsgames Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u test_deriv.py
